<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Spell card</title>
    <style>
      /* color-scheme va en la tarjeta: en la raíz el navegador pinta de negro lo transparente del iframe */
      html, body { margin: 0; height: 100%; background: transparent !important; font-family: "Segoe UI", Roboto, system-ui, sans-serif; color: #efeaff; }
      /* Pegada al borde de abajo: el popover vive en la esquina inferior derecha del mapa */
      body { display: flex; align-items: flex-end; justify-content: flex-end; padding: 8px; box-sizing: border-box; overflow: hidden; }
      #root { display: flex; justify-content: flex-end; width: 100%; max-height: 100%; }
      .card {
        color-scheme: dark; display: flex; flex-direction: column; max-height: calc(100vh - 16px);
        width: 100%; max-width: 360px; box-sizing: border-box; padding: 14px 16px 12px;
        background: linear-gradient(160deg, #2a2338 0%, #17131f 100%);
        border: 1px solid #a98bff; border-radius: 14px;
        box-shadow: 0 0 0 1px #000, 0 12px 40px rgba(0, 0, 0, .6), 0 0 30px rgba(169, 139, 255, .35);
        transform-origin: 100% 100%;
        animation: pop .55s cubic-bezier(.2, 1.4, .3, 1) both, glow 2.4s ease-in-out .5s infinite alternate;
        cursor: pointer;
      }
      .card.out { animation: fade .35s ease-in both; }
      @keyframes pop { 0% { opacity: 0; transform: scale(.6) rotateX(35deg) translateY(30px); } 100% { opacity: 1; transform: none; } }
      @keyframes glow { from { box-shadow: 0 0 0 1px #000, 0 12px 40px rgba(0,0,0,.6), 0 0 18px rgba(169,139,255,.25); } to { box-shadow: 0 0 0 1px #000, 0 12px 40px rgba(0,0,0,.6), 0 0 42px rgba(169,139,255,.55); } }
      @keyframes fade { to { opacity: 0; transform: scale(.9) translateY(10px); } }
      .caster { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: #b9a9ee; }
      h1 { margin: 2px 0 2px; font-size: 22px; line-height: 1.1; }
      .sub { font-size: 12px; color: #c9bfe6; font-style: italic; }
      .meta { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 10px; margin: 10px 0; font-size: 11px; color: #d8d0f0; }
      .meta b { color: #a98bff; font-weight: 600; margin-right: 4px; }
      .desc { font-size: 12.5px; line-height: 1.45; max-height: 260px; min-height: 0; overflow-y: auto; padding-right: 4px; }
      .desc p { margin: 0 0 6px; }
      .higher { margin-top: 6px; font-size: 11.5px; color: #c9bfe6; border-top: 1px solid #3b3350; padding-top: 6px; }
      .foot { display: flex; justify-content: space-between; margin-top: 10px; font-size: 11px; color: #9a8fc2; }
      .cost { color: #7fb8ff; font-weight: 700; }
      .bar { height: 3px; background: #3b3350; border-radius: 2px; margin-top: 6px; overflow: hidden; }
      .bar i { display: block; height: 100%; width: 100%; background: #a98bff; transform-origin: left; animation: drain var(--life) linear forwards; }
      @keyframes drain { to { transform: scaleX(0); } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/card.ts"></script>
  </body>
</html>
